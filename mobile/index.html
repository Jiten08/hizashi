<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hizashi" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/app/icon.svg" />
    <title>Hizashi</title>
    <script>
      // ngrok's free tunnel answers any browser request without this cookie with its warning page:
      // that breaks the live socket and the service worker's update check (the phone keeps an old
      // app). It's the cookie ngrok's "Visit Site" sets; set it here for a year, before anything loads.
      try {
        if (/\.ngrok(-free)?\.(app|dev|io)$/.test(location.hostname))
          document.cookie = "abuse_interstitial=" + location.hostname + "; path=/; max-age=31536000; SameSite=Lax; Secure";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
